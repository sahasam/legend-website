<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load non-render-blocking so the first paint (the landing poster
         below) isn't gated on an external stylesheet round-trip. font-display:swap
         keeps the final rendered type identical. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Sahas Munamala</title>
    <style>
      /* Instant landing imagery: a pixel-accurate snapshot of the WebGL scene's
         first frame, painted with the document's first paint — before the 3D
         bundle has even downloaded. The live <canvas> fades in over it once its
         first frame renders, so the animation's load reads as invisible. Doubles
         as the graceful fallback when WebGL is unavailable. */
      #scene-poster {
        position: fixed;
        inset: 0;
        z-index: -20;
        background: #020611 url(/scene/poster.webp) center center / cover no-repeat;
        opacity: 1;
        transition: opacity 600ms ease 120ms;
      }
      #scene-canvas {
        opacity: 0;
        transition: opacity 600ms ease;
      }
      html[data-scene-ready='1'] #scene-canvas {
        opacity: 1;
      }
      html[data-scene-ready='1'] #scene-poster {
        opacity: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        #scene-poster,
        #scene-canvas {
          transition-duration: 1ms;
        }
      }
    </style>
    <script>
      // Landing route only: preload the poster first (it is the first paint),
      // then the WebGL layer textures (lower priority — they feed the live scene
      // that fades in after). Guarded by pathname so other routes fetch no scene art.
      if (location.pathname === '/') {
        var poster = document.createElement('link');
        poster.rel = 'preload';
        poster.as = 'image';
        poster.href = '/scene/poster.webp';
        poster.setAttribute('fetchpriority', 'high');
        document.head.appendChild(poster);
        var names = ['background', 'midground', 'foreground'];
        for (var i = 0; i < names.length; i++) {
          var l = document.createElement('link');
          l.rel = 'preload';
          l.as = 'image';
          l.href = '/scene/' + names[i] + '.webp';
          // three's ImageLoader requests textures as crossOrigin="anonymous";
          // match that here or the preload is fetched but never reused.
          l.crossOrigin = 'anonymous';
          l.setAttribute('fetchpriority', 'high');
          document.head.appendChild(l);
        }
      }
    </script>
  </head>
  <body class="text-glow-soft">
    <div id="scene-poster" elementtiming="scene-poster"></div>
    <div id="root"></div>
    <script>
      // The poster belongs to the landing route only.
      if (location.pathname !== '/') {
        var p = document.getElementById('scene-poster');
        if (p) p.remove();
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
